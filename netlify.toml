[build]
  publish = "."

[[redirects]]
  from = "/starter"
  to = "/starter.html"
  status = 200

[[redirects]]
  from = "/mission"
  to = "/mission.html"
  status = 200

[[redirects]]
  from = "/kit"
  to = "/kit.html"
  status = 200

[[redirects]]
  from = "/taste-test"
  to = "/taste-test.html"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/learn.html"
  status = 200

[[redirects]]
  from = "/learn/remember"
  to = "/learn-remember.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/gateway-ai-starter-kit.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
