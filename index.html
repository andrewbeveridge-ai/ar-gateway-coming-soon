<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Another Realm Gateway — Coming Soon</title>
  <meta name="description" content="Another Realm Gateway — AI Education Platform. Learn Faster. Earn More. AI Powered.">
  <meta property="og:title" content="Another Realm Gateway — Coming Soon">
  <meta property="og:url" content="https://anotherrealmgateway.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --gold:#D4AF37; --silver:#B8B8B8; --black:#0A0A0A; --white:#FAFAFA; --orange:#FF6B00; --blue:#0080FF; }
    html { height:100%; -webkit-text-size-adjust:100%; }
    body { width:100%; min-height:100%; background:var(--black); color:var(--white); overflow-x:hidden; overflow-y:auto; font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    #starCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; display:block; }
    .scene { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; min-height:100vh; padding:2rem 1.5rem; padding-top:max(2rem,env(safe-area-inset-top)); padding-bottom:max(5rem,env(safe-area-inset-bottom)); }
    .cs-label { font-size:clamp(13px,2.2vw,17px); font-weight:600; letter-spacing:.5em; text-transform:uppercase; color:var(--silver); opacity:1; margin-bottom:2rem; animation:fadeUp 1s .2s ease both; }
    #orbitalWrap { position:relative; width:220px; height:220px; flex-shrink:0; margin-bottom:2.2rem; animation:fadeUp 1s .4s ease both; }
    .ring-mover { position:absolute; top:50%; left:50%; width:0; height:0; }
    .ring { position:absolute; border-radius:50%; border-style:solid; }
    .ring-1 { width:200px; height:80px; top:-40px; left:-100px; border-width:3.5px; border-color:var(--gold); box-shadow:0 0 10px 3px rgba(212,175,55,.6),0 0 24px 8px rgba(212,175,55,.2); transform:rotate(-20deg); }
    .ring-2 { width:165px; height:66px; top:-33px; left:-82.5px; border-width:2.5px; border-color:var(--silver); box-shadow:0 0 6px 1px rgba(184,184,184,.4); transform:rotate(30deg); }
    .ring-3 { width:124px; height:50px; top:-25px; left:-62px; border-width:2px; border-color:var(--orange); box-shadow:0 0 6px 3px rgba(255,107,0,.3), 0 0 12px 5px rgba(255,107,0,.18), 0 0 20px 8px rgba(255,107,0,.08); transform:rotate(-10deg); }
    .ring-4 { width:100px; height:40px; top:-20px; left:-50px; border-width:1.8px; border-color:var(--blue); box-shadow:0 0 8px 2px rgba(0,128,255,.5); transform:rotate(15deg); }
    .core-sphere { position:absolute; top:50%; left:50%; width:45px; height:45px; margin:-22.5px 0 0 -22.5px; border-radius:50%; background:radial-gradient(circle at 32% 28%,rgba(255,140,50,.98) 0%,rgba(255,107,0,.75) 40%,rgba(200,70,0,.3) 100%); box-shadow:0 0 18px 6px rgba(255,107,0,.6),0 0 50px 20px rgba(255,107,0,.2); transition:box-shadow .7s ease; z-index:10; }
    .core-sphere.brightened { box-shadow:0 0 28px 12px rgba(255,107,0,.9),0 0 80px 35px rgba(255,107,0,.4); }
    .brand-another { font-size:clamp(2.2rem,5.5vw,3.8rem); font-weight:700; letter-spacing:.22em; text-transform:uppercase; background:linear-gradient(135deg,var(--gold) 0%,#f5dc6e 35%,var(--gold) 55%,#9a7018 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; background-size:250% 250%; line-height:1; margin-bottom:.3rem; animation:fadeUp 1s .6s ease both,shimmer 4s 1.5s linear infinite; }
    .brand-dba { font-size:clamp(1.1rem,2.8vw,1.6rem); font-weight:600; letter-spacing:.35em; text-transform:uppercase; background:linear-gradient(135deg,var(--white) 0%,var(--silver) 35%,var(--white) 55%,#888 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; background-size:250% 250%; line-height:1; margin-bottom:1.4rem; animation:fadeUp 1s .7s ease both,shimmer 5s 2s linear infinite; }
    .gold-rule { width:180px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin-bottom:1.2rem; animation:fadeUp 1s .9s ease both; }
    .pillars { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:clamp(.78rem,2vw,1rem); letter-spacing:.15em; text-transform:uppercase; background:linear-gradient(135deg,var(--gold) 0%,#f5dc6e 35%,var(--gold) 60%,#c09020 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; background-size:250% 250%; margin-bottom:2rem; text-align:center; animation:fadeUp 1s 1s ease both,shimmer 6s 2.5s linear infinite; line-height:2; }
    .p-mob { display:none; } .p-desk { display:inline; }
    @media(max-width:500px){ .p-mob { display:block; text-align:center; line-height:1.8; } .p-desk { display:none; } .pillars { font-size:clamp(.7rem,3.2vw,.85rem); letter-spacing:.06em; } .success-msg { font-size:.9rem; letter-spacing:.03em; white-space:normal; overflow:visible; line-height:1.5; } .input-row button { padding:.85rem .9rem; font-size:.72rem; letter-spacing:.1em; } }
    .activate-wrap { margin-bottom:1.6rem; position:relative; animation:fadeUp 1s 1.1s ease both; }
    .activate-btn { min-height:44px; padding:.65rem 2.4rem; background:transparent; border:1px solid rgba(255,107,0,.45); color:var(--orange); font-family:'Rajdhani',sans-serif; font-size:.75rem; font-weight:600; letter-spacing:.28em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:border-color .2s,box-shadow .2s,background .2s; -webkit-tap-highlight-color:transparent; }
    .activate-btn:hover { border-color:var(--orange); box-shadow:0 0 16px rgba(255,107,0,.35); }
    .activate-btn.warping { border-color:var(--orange); background:rgba(255,107,0,.06); box-shadow:0 0 24px rgba(255,107,0,.7),0 0 60px rgba(255,107,0,.2); }
    .ripple { position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; border:1.5px solid var(--orange); pointer-events:none; opacity:0; }
    .ripple.active { animation:rippleOut 1s ease-out forwards; }
    @keyframes rippleOut { 0%{transform:scale(1);opacity:.8;} 100%{transform:scale(32);opacity:0;} }
    .form-wrap { width:100%; max-width:420px; animation:fadeUp 1s 1.2s ease both; }
    .form-label { display:block; text-align:center; font-size:clamp(.75rem,1.8vw,.9rem); letter-spacing:.22em; text-transform:uppercase; color:var(--silver); opacity:.88; margin-bottom:.75rem; }
    .input-row { display:flex; border-radius:3px; border:1px solid rgba(212,175,55,.4); overflow:hidden; background:rgba(255,255,255,.025); transition:border-color .2s,box-shadow .2s; }
    .input-row:focus-within { border-color:rgba(212,175,55,.85); box-shadow:0 0 0 3px rgba(212,175,55,.12); }
    .input-row input[type="email"] { flex:1; min-height:48px; padding:.85rem 1.1rem; background:transparent; border:none; outline:none; color:var(--white); font-family:'Rajdhani',sans-serif; font-size:1rem; }
    .input-row input::placeholder { color:rgba(250,250,250,.3); }
    .input-row button { min-height:48px; padding:.85rem 1.4rem; background:transparent; border:none; border-left:1px solid rgba(212,175,55,.4); color:var(--gold); cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; transition:background .2s,color .2s,box-shadow .2s; -webkit-tap-highlight-color:transparent; }
    .input-row button:hover { background:var(--gold); color:var(--black); box-shadow:0 0 18px 4px rgba(212,175,55,.5); }
    .success-msg { display:none; text-align:center; padding:.9rem; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; color:var(--gold); font-size:1.05rem; letter-spacing:.08em; }
    .error-msg { display:none; text-align:center; padding:.45rem; color:#ff7070; font-size:.82rem; }
    .privacy-note { margin-top:.7rem; text-align:center; font-size:clamp(.75rem,1.8vw,.85rem); color:rgba(250,250,250,.62); letter-spacing:.06em; font-family:'DM Mono','Courier New',monospace; }
    .contact-email { margin-top:1.2rem; font-family:'DM Mono','Courier New',monospace; font-size:clamp(.82rem,2vw,1rem); color:var(--silver); opacity:.8; letter-spacing:.08em; animation:fadeUp 1s 1.3s ease both; }
    .site-footer { position:fixed; bottom:0; left:0; right:0; padding:.6rem 1rem max(.9rem,env(safe-area-inset-bottom)); text-align:center; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:rgba(250,250,250,.18); font-family:'Rajdhani',sans-serif; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
    @keyframes shimmer { 0%{background-position:250% center;} 100%{background-position:-250% center;} }
    @media(max-height:720px){ .cs-label{margin-bottom:1rem;} #orbitalWrap{width:170px;height:170px;margin-bottom:1.2rem;} .ring-1{width:155px;height:62px;top:-31px;left:-77.5px;} .ring-2{width:128px;height:51px;top:-25.5px;left:-64px;} .ring-3{width:96px;height:39px;top:-19.5px;left:-48px;} .ring-4{width:77px;height:31px;top:-15.5px;left:-38.5px;} .core-sphere{width:35px;height:35px;margin:-17.5px 0 0 -17.5px;} .brand-another{font-size:clamp(1.8rem,4.5vw,2.8rem);} .activate-wrap{margin-bottom:1rem;} }
    @media(max-width:500px){ #orbitalWrap{width:170px;height:170px;margin-bottom:1.4rem;} .ring-1{width:155px;height:62px;top:-31px;left:-77.5px;} .ring-2{width:128px;height:51px;top:-25.5px;left:-64px;} .ring-3{width:96px;height:39px;top:-19.5px;left:-48px;} .ring-4{width:77px;height:31px;top:-15.5px;left:-38.5px;} .core-sphere{width:35px;height:35px;margin:-17.5px 0 0 -17.5px;} .brand-another{font-size:clamp(1.8rem,5vw,2.6rem);} .pillars{font-size:clamp(.72rem,3.5vw,.88rem);} .form-wrap{max-width:100%;} }
  </style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<form name="gateway-waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="netlifyForm" style="display:none">
  <input type="hidden" name="venture" value="Another Realm Gateway">
  <input type="hidden" name="bot-field"><input type="email" name="email">
</form>
<main class="scene">
  <p class="cs-label">Coming Soon</p>
  <div id="orbitalWrap">
    <div class="ring-mover" id="m1"><div class="ring ring-1"></div></div>
    <div class="ring-mover" id="m2"><div class="ring ring-2"></div></div>
    <div class="ring-mover" id="m3"><div class="ring ring-3"></div></div>
    <div class="ring-mover" id="m4"><div class="ring ring-4"></div></div>
    <div class="core-sphere" id="coreSphere"></div>
  </div>
  <p class="brand-another">Another Realm</p>
  <p class="brand-dba">Gateway</p>
  <div class="gold-rule"></div>
  <p class="pillars">
    <span class="p-desk">Learn Faster &nbsp;◆&nbsp; Earn More &nbsp;◆&nbsp; AI Powered</span>
    <span class="p-mob">◆&nbsp; Learn Faster<br>◆&nbsp; Earn More<br>◆&nbsp; AI Powered</span>
  </p>
  <div class="activate-wrap">
    <button class="activate-btn" id="activateBtn" onclick="activateWarp()">Join The Gateway</button>
    <div class="ripple" id="ripple1"></div>
    <div class="ripple" id="ripple2"></div>
    <div class="ripple" id="ripple3"></div>
  </div>
  <div class="form-wrap">
    <label class="form-label">Get Early Access</label>
    <div class="input-row" id="inputRow">
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" inputmode="email">
      <button onclick="submitEmail()">Notify Me</button>
    </div>
    <div class="success-msg" id="successMsg">&#10022;&nbsp; You're on the list.</div>
    <div class="error-msg" id="errorMsg"></div>
    <p class="privacy-note">No spam &nbsp;·&nbsp; Unsubscribe anytime</p>
  </div>
  <p class="contact-email"><a href="mailto:info@anotherrealmgateway.com" style="color:inherit;text-decoration:none;">info@anotherrealmgateway.com</a></p>
</main>
<footer class="site-footer">&copy; 2026 Another Realm AI International, Inc. &nbsp;|&nbsp; anotherrealmgateway.com</footer>
<script>
/* ── Star field — passive background, never warps ── */
const canvas=document.getElementById('starCanvas'),ctx=canvas.getContext('2d');
let S=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
function initStars(){S=[];for(let i=0;i<200;i++)S.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.4+0.2,b:Math.random()*0.5+0.1,ph:Math.random()*Math.PI*2,sp:0.4+Math.random()*1.2});}
function drawStars(t){ctx.clearRect(0,0,canvas.width,canvas.height);S.forEach(s=>{const a=s.b+(1-s.b)*0.5*(1+Math.sin(s.ph+t*s.sp*0.001));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();s.ph+=0.006;});requestAnimationFrame(drawStars);}
resize();initStars();requestAnimationFrame(drawStars);
window.addEventListener('resize',()=>{resize();initStars();});

/* ── Icon Definitions ── */
const ICON_SVGS = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2a2.5 2.5 0 0 1 5 0v.5A1.5 1.5 0 0 0 16 4a3 3 0 0 1 3 3v.5a1.5 1.5 0 0 0 1.5 1.5A2 2 0 0 1 22 11v1a2 2 0 0 1-1.5 1.937V14a3 3 0 0 1-3 3h-.5a1.5 1.5 0 0 0-1.5 1.5 2.5 2.5 0 0 1-5 0A1.5 1.5 0 0 0 9 17h-.5a3 3 0 0 1-3-3v-.063A2 2 0 0 1 4 12v-1a2 2 0 0 1 1.5-1.937V8.5A1.5 1.5 0 0 0 4 7a3 3 0 0 1 3-3 1.5 1.5 0 0 0 1.5-1.5z"/><circle cx="12" cy="12" r="2"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8" rx="1"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M19.07 4.93l-2.83 2.83M7.76 16.24l-2.83 2.83"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
];
const ICON_COLORS = ['#00CED1','#FFD700','#F97316','#39FF14','#BF5FFF','#FF6EC7'];

/* ── Floating ambient icons (passive background) ── */
const iconLayer = document.getElementById('iconLayer');
const floatIcons = [];
(function(){
  ICON_SVGS.forEach((svg, si) => {
    for(let i=0;i<3;i++){
      const el=document.createElement('div');
      el.className='float-icon';el.innerHTML=svg;
      el.style.color=ICON_COLORS[si];
      const obj={el,x:Math.random()*innerWidth,y:Math.random()*innerHeight,
        vx:((Math.random()-.5)*1.2)||(0.4),vy:((Math.random()-.5)*1.2)||(0.4),
        ph:Math.random()*Math.PI*2,color:ICON_COLORS[si],warping:false};
      el.style.left=obj.x+'px';el.style.top=obj.y+'px';
      iconLayer.appendChild(el);floatIcons.push(obj);
    }
  });
  function tick(t){
    floatIcons.forEach(ic=>{
      if(!ic.warping){
        // Passive float
        ic.x+=ic.vx;ic.y+=ic.vy;
        if(ic.x<-40)ic.x=innerWidth+20;if(ic.x>innerWidth+40)ic.x=-20;
        if(ic.y<-40)ic.y=innerHeight+20;if(ic.y>innerHeight+40)ic.y=-20;
        ic.el.style.left=ic.x+'px';ic.el.style.top=ic.y+'px';
        ic.el.style.opacity=0.07+0.04*Math.sin(ic.ph+t*0.0005);
        ic.el.style.transform='scale(1)';
        ic.el.style.filter='none';
      } else {
        // Warp toward user — move outward from center, scale up
        const cx=innerWidth/2, cy=innerHeight/2;
        const dx=ic.x-cx, dy=ic.y-cy;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const speed=ic.warpSpd*(1+dist/200); // accelerate as they move out
        ic.x+=ic.wvx*speed;ic.y+=ic.wvy*speed;
        // Scale up proportional to distance from center (perspective)
        const sc=Math.max(0.3,Math.min(3.5,dist/80));
        ic.el.style.transform=`scale(${sc})`;
        ic.el.style.opacity=Math.min(0.95, dist/120);
        ic.el.style.left=ic.x+'px';ic.el.style.top=ic.y+'px';
        ic.el.style.filter=`drop-shadow(0 0 ${6*sc}px ${ic.color})`;
        // Reset when off screen
        if(ic.x<-80||ic.x>innerWidth+80||ic.y<-80||ic.y>innerHeight+80){
          resetWarpIcon(ic);
        }
      }
      ic.ph+=0.006;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

function resetWarpIcon(ic){
  // Respawn near center with outward velocity
  const cx=innerWidth/2,cy=innerHeight/2;
  const angle=Math.random()*Math.PI*2;
  const r=Math.random()*30+5;
  ic.x=cx+Math.cos(angle)*r;
  ic.y=cy+Math.sin(angle)*r;
  ic.wvx=Math.cos(angle);
  ic.wvy=Math.sin(angle);
  ic.warpSpd=1.5+Math.random()*2.5;
  ic.el.style.left=ic.x+'px';
  ic.el.style.top=ic.y+'px';
}

window.addEventListener('resize',()=>floatIcons.forEach(ic=>{
  if(ic.x>innerWidth)ic.x=Math.random()*innerWidth;
  if(ic.y>innerHeight)ic.y=Math.random()*innerHeight;
}));

/* ── Activate — icon warp tunnel toward user ── */
let gatewayActive=false;
function activateWarp(){
  if(gatewayActive)return;gatewayActive=true;
  ['ripple1','ripple2','ripple3'].forEach((id,i)=>setTimeout(()=>{
    const r=document.getElementById(id);r.classList.remove('active');void r.offsetWidth;r.classList.add('active');
  },i*200));
  const btn=document.getElementById('activateBtn');
  btn.disabled=true;btn.classList.add('warping');
  btn.textContent='Gateway Activated ✦';
  document.getElementById('coreSphere').classList.add('brightened');
  // Launch all icons outward from center
  floatIcons.forEach((ic,idx)=>setTimeout(()=>{
    ic.warping=true;
    resetWarpIcon(ic);
  },idx*35));
  // Auto-reset after 7s
  setTimeout(()=>{
    floatIcons.forEach(ic=>{
      ic.warping=false;
      ic.el.style.transform='scale(1)';
      ic.el.style.filter='none';
      ic.el.style.opacity='0.07';
    });
    document.getElementById('coreSphere').classList.remove('brightened');
    setTimeout(()=>{
      btn.textContent='Enter The Gateway Realm';
      btn.classList.remove('warping');btn.disabled=false;gatewayActive=false;
    },500);
  },7000);
}
</script>
</body>
</html>
